[build-system]
requires = ["setuptools>=61", "numpy"]
build-backend = "setuptools.build_meta"

[project]
name = "numpy-algebras"
version = "0.3.0"
description = "Custom number types for numpy."
requires-python = ">=3.10"
dependencies = ["numpy"]

[project.optional-dependencies]
test = ["pytest", "scipy"]

[tool.setuptools.packages.find]
where = ["src"]
